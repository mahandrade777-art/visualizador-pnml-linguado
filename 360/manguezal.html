<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tour Virtual 360° — Bosque de Manguezal — PNML II</title>
  <link rel="stylesheet" href="lib/pannellum.css"/>
  <script src="lib/pannellum.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; }
    #panorama { width: 100%; height: 100%; }

    .top-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      max-width: calc(100vw - 28px);
    }
    .top-badge h1 { font-size: 16px; color: #38bdf8; font-weight: 700; margin-bottom: 2px; }
    .top-badge p { font-size: 11px; color: #94a3b8; }

    .nav-actions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 14px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: linear-gradient(135deg, #0369a1, #075985); transform: translateY(-1px); }
    .btn-secondary { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2); }
    .btn-secondary:hover { background: #334155; }
  </style>
</head>
<body>

  <div class="top-badge">
    <h1>🦀 Bosque de Manguezal e Maré em 360°</h1>
    <p>Parque Natural Municipal do Linguado II • Balneário Barra do Sul/SC • Acervo Digital Próprio</p>
  </div>

  <div id="panorama"></div>

  <div class="nav-actions">
    <a href="index.html" class="btn btn-secondary">📸 Ver Acervo Completo (27 Fotos)</a>
    <a href="../index.html" class="btn">🗺️ Ver no Mapa 3D (LiDAR)</a>
    <button class="btn btn-secondary" onclick="viewer.toggleFullscreen()">⛶ Tela Cheia</button>
  </div>

  <script>
    const viewer = pannellum.viewer('panorama', {
      "type": "equirectangular",
      "panorama": "panos/IMG_20260523_112152_00_358.jpg",
      "autoLoad": true,
      "autoRotate": -1,
      "compass": false,
      "showZoomCtrl": true,
      "showFullscreenCtrl": false,
      "orientationOnByDefault": true
    });
  </script>
</body>
</html>
